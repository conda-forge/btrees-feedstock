schema_version: 1

context:
  version: "5.2"

package:
  name: btrees
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/b/btrees/BTrees-${{ version }}.tar.gz
  sha256: 6e4a0af01a4bbec95a9f931baf5c545979f4341a13a7661ff8a497af4f3d8381

build:
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  build:
    - ${{ compiler('c') }}
  host:
    - python
    - setuptools
    - persistent
    - pip
  run:
    - python
    - persistent >=4.1.0
    - zope.interface >=5.0.0

tests:
  - python:
      imports:
        - BTrees
        - BTrees.tests
      pip_check: true
  - requirements:
      run:
        - persistent >=4.4.3
        - transaction
        - zodb
    script:
      - python -m unittest discover -b -v BTrees.tests

about:
  summary: Scalable persistent object containers
  license: ZPL-2.1
  license_file:
    - COPYRIGHT.txt
    - LICENSE.txt
  homepage: https://github.com/zopefoundation/BTrees
  documentation: https://btrees.readthedocs.io

extra:
  recipe-maintainers:
    - osamples
    - izahn
    - mgorny
