schema_version: 1

context:
  name: btrees
  version: "5.2"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.io/packages/source/${{ name[0] }}/${{ name }}/BTrees-${{ version }}.tar.gz
  sha256: 6e4a0af01a4bbec95a9f931baf5c545979f4341a13a7661ff8a497af4f3d8381

build:
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  build:
    - ${{ compiler('c') }}
  host:
    - persistent
    - pip
    - python
  run:
    - persistent >=4.1.0
    - python
    - zope.interface >=5.0.0

tests:
  - python:
      imports:
        - BTrees
        - BTrees.tests
      pip_check: true

about:
  summary: Scalable persistent object containers
  license: ZPL-2.1
  license_file:
    - COPYRIGHT.txt
    - LICENSE.txt
  homepage: https://github.com/zopefoundation/BTrees
  documentation: https://pythonhosted.org/BTrees/

extra:
  recipe-maintainers:
    - osamples
    - izahn
